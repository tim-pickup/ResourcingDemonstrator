<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DM Skills &amp; Demand</title>
  <script>
    // GitHub Pages SPA redirect: preserve path as query param for index.html to restore
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 2).join('/') +
      '/?p=' + encodeURIComponent(l.pathname.slice(1) + (l.search ? '&' + l.search.slice(1) : '')) +
      l.hash
    );
  </script>
</head>
<body></body>
</html>
